name: Handle app request
# アプリから送られた依頼（準備の依頼、動画の追加、通知の登録）を処理する
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  handle:
    # リポジトリの持ち主が作った依頼だけを処理する
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: h
        run: node tools/handle-issue.mjs
        env:
          SHADOWING_PASSWORD: ${{ secrets.SHADOWING_PASSWORD }}
      - name: Commit
        run: |
          git config user.name "shadowing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "Handle app request"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Close
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.h.outputs.result }}
        run: |
          case "$RESULT" in
            subscribed) MSG="通知を登録しました。毎朝9時に届きます。" ;;
            request) MSG="準備の依頼を受け付けました。Claudeが準備します。" ;;
            add) MSG="動画を一覧に追加しました。" ;;
            notfound) MSG="一覧にない動画でした。" ;;
            *) MSG="処理できませんでした（$RESULT）。" ;;
          esac
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "$MSG"
