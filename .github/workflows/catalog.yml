name: Update catalog
# 動画一覧を更新する（毎週月曜 9:00 JST、練習データが追加された時、手動）
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/videos/**', 'config/**', 'tools/**']
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node tools/update-catalog.mjs
        env:
          SHADOWING_PASSWORD: ${{ secrets.SHADOWING_PASSWORD }}
      - name: Commit
        run: |
          git config user.name "shadowing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "Update catalog"
          git pull --rebase origin main
          git push origin HEAD:main
