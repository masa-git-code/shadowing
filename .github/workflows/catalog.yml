name: Update catalog
# 動画一覧を更新する（毎週月曜 9:00 JST、練習データが追加された時、手動）
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/videos/**', 'config/**', 'tools/**']
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # 依頼の処理と同時に main が変わっても上書きしないよう、最新の main でやり直す
      - name: Update and commit
        env:
          SHADOWING_PASSWORD: ${{ secrets.SHADOWING_PASSWORD }}
        run: |
          git config user.name "shadowing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            node tools/update-catalog.mjs
            git add data
            if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
            git commit -q -m "Update catalog"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "保存できませんでした"; exit 1
